site_name: Programación en C — Curso Intensivo
site_description: Curso intensivo de programación en C, 10 sesiones con teoría, ejercicios y práctica guiada.
site_author: David Portillo
site_url: https://davidjara14.github.io/c-programming/

theme:
  name: material
  language: es
  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro
  font:
    text: Roboto
    code: Roboto Mono
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.follow

repo_url: https://github.com/DavidJara14/c-programming
repo_name: DavidJara14/c-programming
edit_uri: ""

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/DavidJara14

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
      title: Contenido

plugins:
  - search:
      lang: es

nav:
  - Inicio: index.md
  - Sesión 1 — Introducción y Variables:
    - Teoría: sesion-01/teoria.md
    - Ejercicios en clase: sesion-01/ejercicios.md
    - Tarea: sesion-01/tarea.md
  - Sesión 2 — Condicionales:
    - Teoría: sesion-02/teoria.md
    - Ejercicios en clase: sesion-02/ejercicios.md
    - Tarea: sesion-02/tarea.md
  - Sesión 3 — Ciclos:
    - Teoría: sesion-03/teoria.md
    - Ejercicios en clase: sesion-03/ejercicios.md
    - Tarea: sesion-03/tarea.md
  - Sesión 4 — Arreglos:
    - Teoría: sesion-04/teoria.md
    - Ejercicios en clase: sesion-04/ejercicios.md
    - Tarea: sesion-04/tarea.md
  - Sesión 5 — Cadenas:
    - Teoría: sesion-05/teoria.md
    - Ejercicios en clase: sesion-05/ejercicios.md
    - Tarea: sesion-05/tarea.md
  - Sesión 6 — Funciones:
    - Teoría: sesion-06/teoria.md
    - Ejercicios en clase: sesion-06/ejercicios.md
    - Tarea: sesion-06/tarea.md
  - Sesión 7 — Apuntadores I:
    - Teoría: sesion-07/teoria.md
    - Ejercicios en clase: sesion-07/ejercicios.md
    - Tarea: sesion-07/tarea.md
  - Sesión 8 — Apuntadores II y Memoria Dinámica:
    - Teoría: sesion-08/teoria.md
    - Ejercicios en clase: sesion-08/ejercicios.md
    - Tarea: sesion-08/tarea.md
  - Sesión 9 — Estructuras:
    - Teoría: sesion-09/teoria.md
    - Ejercicios en clase: sesion-09/ejercicios.md
    - Tarea: sesion-09/tarea.md
  - Sesión 10 — Archivos:
    - Teoría: sesion-10/teoria.md
    - Ejercicios en clase: sesion-10/ejercicios.md
    - Tarea: sesion-10/tarea.md
